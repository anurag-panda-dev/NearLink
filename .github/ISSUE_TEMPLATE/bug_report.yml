name: Bug Report
description: File a bug report or crash in NearLink
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe what happened.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open NearLink
        2. Tap Scan in Nearby
        3. Observe...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: e.g. Google Pixel 8, Android 14 / iPhone 15, iOS 17.5
    validations:
      required: true
